name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repository previously carried 59 committed .pyc files and 21 editor swap
      # files. This keeps them from coming back via a stray `git add -A`.
      - name: No build artefacts or editor swap files committed
        run: |
          set -eu
          bad=$(git ls-files | grep -E '(\.pyc$|__pycache__/|\.py\.tmp\.)' || true)
          if [ -n "$bad" ]; then
            echo "::error::build artefacts / swap files are tracked:"
            echo "$bad"
            exit 1
          fi
          echo "clean"
